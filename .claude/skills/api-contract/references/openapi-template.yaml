# OpenAPI 3.0 模板 —— 复制后修改 info / paths / components 三处
# 校验：npx --yes @redocly/cli lint openapi.yaml
openapi: 3.0.3
info:
  title: 示例服务 API
  version: 1.0.0
  description: |
    接口契约文档。错误响应统一为：
    `{"error": {"code": "ERROR_CODE", "message": "给人看的说明"}}`
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
paths:
  /users:
    get:
      summary: 用户列表
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409":
          description: 邮箱已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{userId}:
    get:
      summary: 用户详情
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: USER_NOT_FOUND }
            message: { type: string, example: 用户不存在 }
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: string, format: uuid, example: 3f2a... }
        email: { type: string, format: email }
        nickname: { type: string, nullable: true }
        created_at: { type: string, format: date-time, example: "2026-08-13T09:00:00Z" }
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        nickname: { type: string, maxLength: 32 }
    UserPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        total: { type: integer, example: 128 }
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
